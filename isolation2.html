<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edge InPrivate Isolation Test 2</title>
</head>
<body>

<h2>Edge InPrivate Isolation Test 2</h2>

<button onclick="setNormal()">SET NORMAL DATA</button>
<br><br>

<button onclick="setPrivate()">SET INPRIVATE DATA</button>
<br><br>

<button onclick="readData()">READ DATA</button>

<pre id="result">Ready</pre>

<script>
function readData() {
  document.getElementById("result").textContent =
    "localStorage = " +
    (localStorage.getItem("edge_boundary_test") || "NONE") +
    "\n" +
    "boundary_cookie = " +
    (document.cookie
      .split("; ")
      .find(row => row.startsWith("edge_boundary_cookie=")) || "NONE");
}
</script>

</body>
</html>
