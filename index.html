<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cross-Origin Download Test</title>
</head>
<body>

<h2>Cross-Origin Download Test</h2>

<button onclick="directDownload()">
  DIRECT CROSS-ORIGIN DOWNLOAD
</button>

<script>
function directDownload() {
  const a = document.createElement("a");

  a.href = "https://edge-download-test.netlify.app/download";
  a.download = "cross-origin-test.txt";

  document.body.appendChild(a);
  a.click();
  a.remove();
}
</script>

</body>
</html>
